services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: agendamento_app
    volumes:
      - .:/var/www
      - ./custom.ini:/usr/local/etc/php/conf.d/custom.ini
    working_dir: /var/www
    networks:
      - agendamento_net
      - proxy_net

  nginx:
    image: nginx:latest
    container_name: agendamento_nginx
    expose:
      - "80"          # ← não expõe pro host, só pro NPM
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - agendamento_net
      - proxy_net     # ← NPM precisa enxergar esse container

  mysql:
    image: mysql:8.0
    container_name: agendamento_mysql
    environment:
      MYSQL_DATABASE: agendamento
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: agendamento
      MYSQL_PASSWORD: secret
    ports:
      - "3308:3306"
    volumes:
      - agendamento_mysql_data:/var/lib/mysql
    networks:
      - agendamento_net

  redis:
    image: redis:7-alpine
    container_name: agendamento_redis
    volumes:
      - agendamento_redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - agendamento_net

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: agendamento_worker
    volumes:
      - .:/var/www
      - ./custom.ini:/usr/local/etc/php/conf.d/custom.ini
    working_dir: /var/www
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --sleep=3
      - --tries=3
      - --max-time=3600
      - --timeout=90
    restart: unless-stopped
    depends_on:
      - redis
      - mysql
    networks:
      - agendamento_net

  socket:
    image: node:20-alpine
    container_name: agendamento_socket
    working_dir: /app
    volumes:
      - ./socket-server:/app
    command: sh -c "npm install && node index.js"
    expose:
      - "3001"
    networks:
      - agendamento_net

  # ─── Nginx Proxy Manager ───────────────────────────────────────────
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx_proxy_manager
    restart: always
    ports:
      - "80:80"       # HTTP (todos os domínios)
      - "443:443"     # HTTPS (todos os domínios)
      - "81:81"       # Painel admin do NPM
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - proxy_net

networks:
  agendamento_net:
    driver: bridge
  proxy_net:
    name: proxy_net
    driver: bridge

volumes:
  agendamento_mysql_data:
  agendamento_redis_data:
  npm_data:
  npm_letsencrypt: